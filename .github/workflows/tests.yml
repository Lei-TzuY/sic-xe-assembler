name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile check
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify fixtures
        run: python verify.py
